name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 정합성 린트
        run: bash scripts/lint-consistency.sh
      - name: 훅 회귀 테스트
        run: bash scripts/hook-tests.sh
      - name: Codex 배포 리소스 검사
        run: python3 scripts/sync-codex-resources.py --check
      - name: gx-ralph 러너 테스트
        run: bash scripts/test-gx-ralph.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 행동 테스트 러너 (mock)
        run: bash scripts/test-behavior-tests.sh
  codex-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Codex 리소스 정합성
        run: python scripts/sync-codex-resources.py --check
      - name: Codex 오프라인 계약 테스트
        run: python -m unittest discover -s tests -p "test_codex_*.py" -v
