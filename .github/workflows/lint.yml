name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 린트 [1/36]이 최근 버전 태그 이후 배포 경로 변경과 버전을 대조하려면 태그가 필요하다.
          fetch-depth: 0
      - name: 정합성 린트
        run: bash scripts/lint-consistency.sh
      - name: 훅 회귀 테스트
        run: bash scripts/hook-tests.sh
      - name: Codex 배포 리소스 검사
        run: python3 scripts/sync-codex-resources.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 행동 테스트 러너 (mock)
        run: bash scripts/test-behavior-tests.sh
  codex-contract:
    env:
      PYTHONUTF8: '1'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Windows Git Bash 경로
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gxGitBin = Join-Path $env:ProgramFiles 'Git/bin'
          $gxGitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Codex 리소스 정합성
        run: python scripts/sync-codex-resources.py --check
      - name: Codex 오프라인 계약 테스트
        run: python -m unittest discover -s tests -p "test_codex_*.py" -v
      - name: 보조 스킬 보호·복구·조회 회귀
        run: python -m unittest discover -s tests -p "test_gx_aux_*.py" -v
      - name: 공통 진입·배포·지시문 예산
        run: python -m unittest discover -s tests -p "test_gx_work*.py" -v
      - name: 컨텍스트 인계·작업계획 정합성
        run: python -m unittest discover -s tests -p "test_gx_context_workflow.py" -v
      - name: 개발 전후 관련 문서 대조
        run: python -m unittest discover -s tests -p "test_gx_development_context.py" -v
      - name: 공유 결정 이력의 제한 조회·Git 출처
        run: python -m unittest discover -s tests -p "test_gx_history.py" -v
      - name: 정책 근거·영향 분석 계약
        run: python -m unittest discover -s tests -p "test_gx_lens*.py" -v
      - name: 영향 범위 선택·증거 재사용
        run: python -m unittest discover -s tests -p "test_gx_test_plan.py" -v
