name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 정합성 린트
        run: bash scripts/lint-consistency.sh
      - name: 훅 회귀 테스트
        run: bash scripts/hook-tests.sh
      - name: gx-ralph 러너 테스트
        run: bash scripts/test-gx-ralph.sh
